# ╔══════════════════════════════════════════════════════════════════╗
# ║  DESIGN SYSTEM — Kupanga (refonte 2026)                          ║
# ║  Version 2.0 · 7 novembre 2026                                   ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# CE FICHIER EST UN RÉSUMÉ. FONT FOI :
#   1. la table des jetons de docs/refonte-front/00-vue-ensemble.md (« Correspondance des jetons ») ;
#   2. src/styles/_theme.scss (valeurs exactes, thème clair et thème sombre).
# En cas d'écart, ce sont eux qui ont raison : corriger ce fichier, pas le code.
#
# Il remplace la version 1.0 (palette « Olive #8FA464 », DM Serif Display / DM Sans / DM Mono), abandonnée par la
# refonte : l'olive devient foncée (#4F6A2E), la police unique est Figtree, le nom « kupanga » est le SVG du logo.
# Les jetons s'utilisent toujours en variables CSS : var(--kp-…). Aucune couleur écrite en dur hors de _theme.scss.

meta:
  name: "Kupanga — Design System"
  version: "2.0.0"
  last_updated: "2026-11-07"
  source_of_truth:
    - "docs/refonte-front/00-vue-ensemble.md#correspondance-des-jetons"
    - "src/styles/_theme.scss"
  references:
    deliverable: "../frontend-audit/livraison-dev.md (Table des jetons)"
    mockups: "../frontend-audit/maquettes/ (DS-Fondations, DS-Composants)"

# ──────────────────────────────────────────────
# 1. COULEURS (clair / sombre)
# Thème clair par défaut ; sombre selon l'appareil ou le choix du compte (data-theme="light|dark").
# ──────────────────────────────────────────────
colors:
  base:
    --kp-bg:              { light: "#F4F5F1",                 dark: "#0B181F",                 role: "Fond de page" }
    --kp-surface:         { light: "#FFFFFF",                 dark: "#10212B",                 role: "Cartes, barres, fenêtres" }
    --kp-surface-sunken:  { light: "#EDEFE8",                 dark: "#182C38",                 role: "Surface en retrait, survol, vignette vide" }
    --kp-segment-bg:      { light: "#E6EAE0",                 dark: "#213846",                 role: "Fond du contrôle segmenté et des onglets de page" }
    --kp-border:          { light: "rgba(16,33,43,0.08)",     dark: "rgba(239,251,219,0.10)",  role: "Contour des cartes" }
    --kp-border-strong:   { light: "rgba(16,33,43,0.14)",     dark: "rgba(239,251,219,0.20)",  role: "Champs, boutons secondaires, pilules" }

  text:
    --kp-text:            { light: "#10212B",                 dark: "#EFFBDB",                 role: "Texte principal ; élément actif plein" }
    --kp-text-muted:      { light: "#46545C",                 dark: "rgba(239,251,219,0.80)",  role: "Texte secondaire" }
    --kp-text-subtle:     { light: "#636F76",                 dark: "rgba(239,251,219,0.62)",  role: "Mentions (4,72:1 sur --kp-bg)" }
    --kp-text-on-accent:  { light: "#FFFFFF",                 dark: "#10212B",                 role: "Texte sur l'olive et sur le nuit plein" }

  accent:
    # L'olive est la seule couleur d'action : bouton principal olive partout (décision du 7 novembre 2026).
    --kp-accent:          { light: "#4F6A2E",                 dark: "#A1B577",                 role: "Bouton principal, liens, sélection" }
    --kp-accent-hover:    { light: "#435A27",                 dark: "#B5CA8D",                 role: "Survol du bouton principal" }
    --kp-accent-soft:     { light: "#EDF3E0",                 dark: "rgba(143,164,100,0.18)",  role: "Aplat olive clair (états vides, repère, filtre actif)" }

  state:
    # Point / fond de badge / texte de badge
    success: { dot: { light: "#2F8A4E", dark: "#6FBF86" }, bg: { light: "#E5F1E8", dark: "rgba(47,138,78,0.22)" },  text: { light: "#22663A", dark: "#A6DCB4" } }
    warning: { dot: { light: "#B7791F", dark: "#E0A84A" }, bg: { light: "#FBEFDD", dark: "rgba(183,121,31,0.22)" }, text: { light: "#8A5A12", dark: "#E8C87A" } }
    danger:  { dot: { light: "#B42318", dark: "#EC7A6A" }, bg: { light: "#FBE9E7", dark: "rgba(180,35,24,0.26)" },  text: { light: "#8E1B12", dark: "#F2A99C" } }
    neutral: { dot: { light: "#66737A", dark: "rgba(239,251,219,0.55)" }, bg: { light: "#EDEFE8", dark: "rgba(239,251,219,0.08)" }, text: { light: "#46545C", dark: "rgba(239,251,219,0.80)" } }
    tokens: "--kp-state-{success|warning|danger|neutral}[-bg|-text]"

  overlays:
    --kp-backdrop:        { light: "rgba(16,33,43,0.45)",     dark: "rgba(0,0,0,0.60)",        role: "Voile des fenêtres" }
    --kp-photo-voile:     { both: "rgba(16,33,43,0.80)",       role: "Pastilles posées sur une photo" }
    --kp-photo-texte:     { both: "#FFFFFF" }
    --kp-photo-fond:      { both: "#000000",                   role: "Plein écran des photos" }

  fixed:
    # Mêmes valeurs dans les deux thèmes
    energy_classes:
      role: "Échelle DPE / GES A à G (kp-classe-energie), lettre en nuit"
      --kp-classe-a: "#3E8E56"
      --kp-classe-b: "#6FAE5A"
      --kp-classe-c: "#B5CC5A"
      --kp-classe-d: "#E8D35A"
      --kp-classe-e: "#EDB255"
      --kp-classe-f: "#E28A4A"
      --kp-classe-g: "#D2573C"
      --kp-classe-texte: "#10212B"
    whatsapp: { --kp-whatsapp: "#1F7A3F", --kp-whatsapp-hover: "#1A6A36", --kp-whatsapp-texte: "#FFFFFF", role: "Vert de la marque WhatsApp" }
    signature:
      role: "Zone de signature : image envoyée à l'API, fond blanc quel que soit le thème"
      --kp-signature-fond: "#FFFFFF"
      --kp-signature-trait: "#10212B"
      --kp-signature-aide: "#9AA4A9"
      --kp-signature-ligne: "#C4CAB9"
      --kp-signature-mention: "#66737A"

# ──────────────────────────────────────────────
# 2. TYPOGRAPHIE
# ──────────────────────────────────────────────
typography:
  family:
    --kp-font: "'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    weights: [400, 500, 600]
    notes:
      - "Titres en Figtree 500 ; plus de police de titre séparée (--kp-font-display supprimé)."
      - "Le nom « kupanga » n'est jamais du texte : composant kp-logo (SVG clair ou sombre)."
  sizes:
    --kp-fs-mention:     "12px"
    --kp-fs-secondary:   "13px"
    --kp-fs-body:        "15px (interligne 22 px : --kp-lh-body 1.4667)"
    --kp-fs-card-title:  "17px"
    --kp-fs-subtitle:    "20px"
    --kp-fs-page-title:  "clamp(24px, 1.2rem + 1.2vw, 32px)"
    --kp-fs-landing:     "clamp(40px, 2rem + 2.5vw, 56px), interlettrage -0.03em"

# ──────────────────────────────────────────────
# 3. ESPACEMENTS (grille de 4 px)
# ──────────────────────────────────────────────
spacing:
  --kp-space-1: "4px"
  --kp-space-2: "8px"
  --kp-space-3: "12px"
  --kp-space-4: "16px"
  --kp-space-6: "24px"
  --kp-space-8: "32px"
  --kp-space-12: "48px"
  --kp-space-5: "20px — hors grille, seulement le retrait horizontal des boutons (0 20px dans les maquettes)"
  layout:
    --kp-page-pad: "clamp(12px, 1.6vw, 24px)"
    --kp-card-pad: "clamp(16px, 1.4vw, 20px)"
    --kp-sidebar-w: "clamp(208px, 15vw, 240px)"
    --kp-tap: "44px (cible tactile minimale)"
    mechanics: "--kp-safe-*, --kp-tabbar-h, --kp-bottom-offset, --kp-top-offset : posés par la mise en page"
  breakpoints:
    telephone: "< 768px"
    tablette: ">= 768px"
    ordinateur: ">= 1100px"

# ──────────────────────────────────────────────
# 4. RAYONS
# ──────────────────────────────────────────────
radius:
  --kp-radius-sm: "8px"
  --kp-radius-md: "12px"
  --kp-radius-lg: "20px (cartes)"
  --kp-radius-pill: "999px (boutons, pilules, segments)"

# ──────────────────────────────────────────────
# 5. PROFONDEUR (ombres)
# ──────────────────────────────────────────────
elevation:
  --kp-elev-0: { light: "0 0 0 1px rgba(16,33,43,0.08)", role: "Cartes" }
  --kp-elev-1: { light: "0 0 0 1px rgba(16,33,43,0.08), 0 8px 24px rgba(16,33,43,0.06)", role: "Barres, menus, toasts, carte collée" }
  --kp-elev-2: { light: "0 0 0 1px rgba(16,33,43,0.06), 0 24px 48px rgba(16,33,43,0.16)", role: "Fenêtres" }
  dark: "Contour menthe à 8 % et ombre noire : voir @mixin sombre"
  --kp-focus: "0 0 0 2px var(--kp-surface), 0 0 0 4px var(--kp-text) — anneau nuit (menthe en sombre), toujours visible au clavier"

# ──────────────────────────────────────────────
# 6. MOUVEMENT
# ──────────────────────────────────────────────
motion:
  --kp-duree: "160ms"
  --kp-duree-lente: "480ms"
  --kp-ease: "cubic-bezier(0.22, 1, 0.36, 1)"
  reduced_motion: "Durées à 0 si prefers-reduced-motion: reduce"

# ──────────────────────────────────────────────
# 7. COMPOSANTS (src/app/shared/ui, src/styles/_components.scss)
# ──────────────────────────────────────────────
components:
  buttons: ".kp-btn --primary (olive, une action forte par écran) · --secondary (contour) · --ghost (discret) · --danger · --whatsapp ; pilule 44 px, 40 px avec --sm"
  segmented: "kp-segmented (fond --kp-segment-bg, actif nuit plein) ; kp-onglets (onglets de page en liens)"
  cards: ".kp-card, rayon 20 px, --kp-elev-0"
  status: "kp-statut (badge ou point + texte)"
  empty: "kp-vide (icône Lucide au trait 1,5 sur aplat olive clair)"
  others: "kp-logo, kp-frise, kp-sheet, kp-assistant, kp-galerie, kp-classe-energie, kp-carte-bien, .kp-table, .kp-bandeau"
  icons: "Lucide uniquement (core/icones.ts), trait 1,5 à 2"
