@if (isSelf) {
  <p class="kp-muted kp-small soi">Vous ne pouvez pas vous écrire à vous-même.</p>
} @else {
  <label class="kp-sr-only" for="message">Message à {{ interlocuteurNom }}</label>
  <textarea #champ id="message" class="champ" rows="1" maxlength="2000" placeholder="Message"
            enterkeyhint="send" autocomplete="off"
            [value]="texte()" (input)="saisir($any($event.target).value)" (keydown)="onKeydown($event)"></textarea>
  <button type="button" class="envoyer" [disabled]="!canSend" (click)="send()" aria-label="Envoyer">
    <kp-icon name="send" [size]="20" />
  </button>
}
